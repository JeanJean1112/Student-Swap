*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--body);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.5;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
img{display:block;max-width:100%;}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;}
.skip{position:absolute;left:-999px;top:0;background:var(--green);color:#fff;padding:10px 16px;z-index:1000;}
.skip:focus{left:0;}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;}

/* ---------- header ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px var(--pad);}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;font-size:1.5rem;letter-spacing:-.01em;}
.brand img{height:46px;width:auto;}
.brand em{font-style:normal;color:var(--green);}
.top{display:flex;align-items:center;gap:6px;}
.top-link{padding:8px 14px;border-radius:999px;font-weight:500;font-size:.93rem;color:var(--ink-soft);}
.top-link:hover,.top-link.active{background:var(--green-tint);color:var(--green-deep);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;border:2px solid transparent;transition:.18s ease;white-space:nowrap;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-deep);}
.btn-outline{border-color:var(--ink);color:var(--ink);}
.btn-outline:hover{background:var(--ink);color:#fff;}
.btn-sm{padding:8px 16px;font-size:.88rem;}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;padding:0 var(--pad);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;}
.page{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(20px,4vw,64px);align-items:center;animation:rise .38s ease both;}
@keyframes rise{from{opacity:0;}to{opacity:1;}}
.copy{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(10px,2vh,20px);min-width:0;}
.eyebrow{display:inline-flex;padding:6px 14px;border-radius:999px;background:var(--green-tint);color:var(--green-deep);font-weight:700;font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;}
h1{font-family:var(--head);font-weight:600;font-size:clamp(2rem,min(4.3vw,7vh),4.1rem);line-height:1.04;letter-spacing:-.02em;text-wrap:balance;}
h1 em{font-style:normal;color:var(--green);}
.lead{font-size:clamp(1rem,min(1.3vw,2.5vh),1.2rem);color:var(--ink-soft);max-width:52ch;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:.85rem;}
.chip::before{content:"\2713";color:var(--green);font-weight:800;}
.ctas{display:flex;flex-wrap:wrap;gap:12px;}
.points{display:grid;gap:8px;list-style:none;}
.points li{position:relative;padding-left:28px;font-size:clamp(1rem,min(1.3vw,2.5vh),1.15rem);color:var(--ink-soft);}
.points li::before{content:"\2713";position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:var(--green-tint);color:var(--green);font-size:.72rem;font-weight:800;display:grid;place-items:center;}
.points b{color:var(--ink);}
.note{font-size:.82rem;color:var(--ink-soft);}

.visual{height:100%;min-height:0;padding:clamp(4px,1.2vh,14px) 0;display:flex;flex-direction:column;justify-content:center;position:relative;}

/* mosaic */
.mosaic{display:grid;gap:12px;height:100%;max-height:640px;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));grid-template-areas:"j p b" "j y b" "s r b";}
.tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;min-height:0;box-shadow:0 6px 18px -12px rgba(28,42,34,.3);}
.tile img{width:100%;height:100%;object-fit:contain;padding:10px;}
.tile.cover img{object-fit:cover;padding:0;}
.tile .tag{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tag b{color:var(--green);margin-left:4px;}
.a-j{grid-area:j}.a-p{grid-area:p}.a-b{grid-area:b}.a-y{grid-area:y}.a-s{grid-area:s}.a-r{grid-area:r}
.badge{position:absolute;right:-6px;top:-4px;z-index:3;width:112px;height:112px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;text-align:center;font-weight:700;font-size:.8rem;line-height:1.1;transform:rotate(8deg);box-shadow:0 10px 24px -8px rgba(22,79,57,.7),inset 0 0 0 4px rgba(255,255,255,.35);padding:10px;transition:transform .2s;}
.badge:hover{transform:rotate(2deg) scale(1.05);}
.badge b{display:block;font-family:var(--head);font-size:1.7rem;}

/* payout card */
.payout{align-self:center;width:100%;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:clamp(16px,3vh,28px);display:grid;gap:clamp(8px,1.6vh,16px);}
.payout-top{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:16px;align-items:center;}
.payout-top img{width:100%;max-height:min(24vh,200px);object-fit:contain;}
.payout-top h3{font-family:var(--head);font-size:1.3rem;font-weight:600;line-height:1.1;}
.payout-top p{font-size:.85rem;color:var(--ink-soft);}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:1rem;}
.row span{color:var(--ink-soft);}
.row b{font-variant-numeric:tabular-nums;}
.row.keep{border-top:2px solid var(--ink);}
.row.keep span{color:var(--ink);font-weight:600;}
.row.keep b{font-family:var(--head);font-size:1.9rem;color:var(--green);}
.minus{color:var(--coral);}

/* category */
.cat{display:flex;flex-direction:column;gap:12px;height:100%;min-height:0;}
.featured{flex:1;min-height:0;display:grid;gap:12px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);}
.card{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);}
.card-img{flex:1;min-height:0;background:#fff;}
.card-img img{width:100%;height:100%;object-fit:contain;padding:12px;}
.card-img.cover img{object-fit:cover;padding:0;}
.card-info{padding:12px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--border);flex-wrap:wrap;}
.card-info b{display:block;font-weight:600;font-size:1rem;line-height:1.2;}
.card-info .price{font-family:var(--head);font-weight:600;font-size:1.25rem;color:var(--green);font-variant-numeric:tabular-nums;}
.offer{padding:7px 14px;border-radius:999px;border:1.5px solid var(--green);color:var(--green);font-weight:600;font-size:.82rem;}
.offer:hover{background:var(--green);color:#fff;}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.also-label{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-right:4px;}
.mini{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:.86rem;font-weight:500;}
.mini b{color:var(--green);font-variant-numeric:tabular-nums;}
.mini .offer{padding:3px 10px;font-size:.76rem;}

/* trust + team */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.info{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:clamp(14px,2.4vh,24px);display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px -12px rgba(28,42,34,.3);}
.icon{width:46px;height:46px;border-radius:14px;background:var(--green-tint);color:var(--green);display:grid;place-items:center;}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.info h3{font-family:var(--head);font-size:1.15rem;font-weight:600;line-height:1.15;}
.info p{font-size:.9rem;color:var(--ink-soft);line-height:1.35;}
.grid .info:last-child:nth-child(odd){grid-column:1/-1;}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.member{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:clamp(12px,2.2vh,20px);text-align:center;}
.avatar{width:clamp(52px,9vh,72px);aspect-ratio:1;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-family:var(--head);font-weight:600;font-size:1.5rem;}
.member b{display:block;font-family:var(--head);font-weight:600;font-size:1.1rem;}
.member span{font-size:.82rem;color:var(--ink-soft);}

/* ---------- dock ---------- */
.dock{display:flex;justify-content:center;padding:6px var(--pad) 14px;min-width:0;}
.dock-bar{display:flex;gap:clamp(4px,1.2vw,14px);background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:7px 12px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none;}
.dock-bar::-webkit-scrollbar{display:none;}
.dock-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;border-radius:20px;font-weight:600;font-size:.82rem;color:var(--ink-soft);flex:none;transition:background .15s;}
.dock-item:hover{background:var(--sand);}
.dock-item.active{background:var(--green-tint);color:var(--green-deep);}
.thumb{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--border);display:grid;place-items:center;overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:contain;padding:3px;}
.thumb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.thumb.sell{background:var(--green);border-color:var(--green);}
.dock-item.active .thumb{border-color:var(--green);}
.only-small{display:none;}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal.is-open{display:flex;}
.modal__bg{position:absolute;inset:0;background:rgba(28,42,34,.55);}
.modal__panel{position:relative;width:100%;max-width:500px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px;padding:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
.modal__close{position:absolute;top:10px;right:16px;font-size:2rem;line-height:1;color:var(--ink-soft);}
.modal h2{font-family:var(--head);font-weight:600;font-size:1.7rem;line-height:1.1;margin-bottom:.5rem;}
.modal p{color:var(--ink-soft);font-size:.98rem;margin-bottom:.6rem;}
.modal label{display:block;font-weight:600;font-size:.88rem;margin:.8rem 0 .25rem;}
.modal input,.modal select,.modal textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;}
.modal textarea{resize:vertical;}
.modal .hint{font-size:.8rem;margin-top:.3rem;}
.modal__submit{margin-top:1.1rem;width:100%;background:var(--green);color:#fff;border-radius:999px;font-weight:600;font-size:1rem;padding:14px;}
.modal__submit:hover{background:var(--green-deep);}
.modal__msg{color:var(--green);font-weight:600;margin-top:.8rem;min-height:1.2em;font-size:.95rem;}

/* ---------- small screens ---------- */
@media (max-width:860px){
  .top-link{display:none;}
  .brand{font-size:1.3rem;}
  .brand img{height:38px;}
  .page{display:block;height:auto;padding:6px 0 18px;}
  .copy{margin-bottom:18px;}
  h1{font-size:clamp(1.9rem,8vw,2.6rem);}
  .visual{height:auto;display:block;}
  .mosaic{height:auto;grid-template-rows:repeat(3,128px);}
  .badge{width:92px;height:92px;font-size:.68rem;right:-2px;top:-14px;}
  .badge b{font-size:1.35rem;}
  .featured{grid-auto-flow:row;}
  .card-img{height:220px;flex:none;}
  .grid{grid-template-columns:1fr 1fr;}
  .team{grid-template-columns:repeat(2,minmax(0,1fr));}
  .dock-item{padding:4px 10px;}
  .dock{padding-bottom:8px;}
  .thumb{width:40px;height:40px;}
  .only-small{display:flex;}
}
@media (max-width:560px){
  .btn.hide-xs{display:none;}
  .grid{grid-template-columns:1fr;}
}
@media (max-height:600px) and (min-width:861px){
  .lead,.note{display:none;}
  .thumb{width:36px;height:36px;}
  .brand img{height:36px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<!-- Wishlist modal -->
<div class="modal" id="modal-wish" role="dialog" aria-modal="true" aria-labelledby="wishTitle" aria-hidden="true">
  <div class="modal__bg" data-close></div>
  <div class="modal__panel">
    <button class="modal__close" data-close type="button" aria-label="Close">×</button>
    <h2 id="wishTitle">Tell us what you're looking for.</h2>
    <p id="wishIntro">Buying or selling, tell us and we'll check if we can match you.</p>
    <form id="wishForm">
      <label for="w-name">Full name</label>
      <input id="w-name" type="text" required autocomplete="name" placeholder="Camila Fernández">
      <label for="w-email">University email</label>
      <input id="w-email" type="email" required autocomplete="email" placeholder="you@youruniversity.cl">
      <label for="w-phone">Phone number</label>
      <input id="w-phone" type="tel" required autocomplete="tel" placeholder="+56 9 1234 5678" pattern="[+]?[0-9][0-9 ]{6,17}" title="A phone number, for example +56 9 1234 5678">
      <p class="hint">Everyone registers with a university email, a phone number and ID verification, so we always know who is who.</p>
      <label for="w-role">I want to...</label>
      <select id="w-role" required>
        <option value="" disabled>Select one</option>
        <option value="seller">Sell</option>
        <option value="buyer">Buy</option>
        <option value="both">Both</option>
      </select>
      <label for="w-details" id="wishDetailsLabel">What are you looking for, or selling?</label>
      <textarea id="w-details" rows="3" placeholder="e.g. Looking for a rice cooker under $15.000"></textarea>
      <button class="modal__submit" id="wishBtn" type="submit">Join the wishlist</button>
      <p class="modal__msg" id="wishMsg" role="status"></p>
    </form>
  </div>
</div>

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fmt(n){ return '$' + n.toLocaleString('es-CL'); }
  function clp(n){ return fmt(n) + ' CLP'; }

  var CHIPS = '<div class="chips"><span class="chip">University email</span><span class="chip">Phone number</span><span class="chip">ID verification</span></div>';
  function ctaOffer(){ return '<button class="btn btn-outline" data-wish="buyer" type="button">Can\'t find it? Tell us what you want</button>'; }

  function tile(key, area){
    var p = PRODUCTS[key];
    return '<div class="tile a-'+area+(COVER[key]?' cover':'')+'"><img src="'+IMG[key]+'" alt="'+esc(p.n)+', example listing">'+
           '<span class="tag">'+esc(p.n)+'<b>'+fmt(p.p)+'</b></span></div>';
  }

  function featuredCard(key){
    var p = PRODUCTS[key];
    return '<article class="card"><div class="card-img'+(COVER[key]?' cover':'')+'"><img src="'+IMG[key]+'" alt="'+esc(p.n)+', example listing"></div>'+
      '<div class="card-info"><div><b>'+esc(p.n)+'</b><span class="price">'+fmt(p.p)+'</span></div>'+
      '<button class="offer" type="button" data-offer="p:'+key+'">Make an offer</button></div></article>';
  }

  function catVisual(cat){
    var c = CATS[cat];
    return '<div class="visual"><div class="cat"><div class="featured">'+c.featured.map(featuredCard).join('')+'</div>'+
      '<div class="also"><span class="also-label">Also listed</span>'+
      c.also.map(function(a,i){ return '<span class="mini">'+esc(a[0])+' <b>'+fmt(a[1])+'</b><button class="offer" type="button" data-offer="a:'+cat+':'+i+'">Offer</button></span>'; }).join('')+
      '</div><p class="note">Example listings, shown before launch. Every price is negotiable.</p></div></div>';
  }

  function infoCard(icon, title, text){
    return '<div class="info"><span class="icon">'+I[icon]+'</span><h3>'+title+'</h3><p>'+text+'</p></div>';
  }

  var PAGES = {
    home:{title:'Your old stuff wants a new home', html:function(){
      return '<section class="page"><div class="copy">'+
        '<span class="eyebrow">From students, for students</span>'+
        '<h1>Your old stuff wants a new home. <em>Choose one you can trust.</em></h1>'+

    }},
    sell:{title:'Sell', html:function(){
      var j = PRODUCTS.jacket, fee = Math.round(j.p*0.08);
      return '<section class="page"><div class="copy">'+
        '<span class="eyebrow">Sellers</span>'+
        '<h1>Stop hoarding. <em>Start cashing in.</em></h1>'+
        '<ul class="points"><li><b>List it free.</b> No cost until it sells.</li><li><b>Keep 92% of every sale.</b> We take 8% only when it sells.</li><li><b>Sell only to verified students.</b> Every buyer has a university email, a phone number and ID verification.</li><li><b>Buyers pay nothing.</b> No ghosts, no shady strangers.</li></ul>'+
        '<div class="ctas"><button class="btn btn-primary" data-wish="seller" type="button">Start selling now</button></div>'+
        '</div><div class="visual"><div class="payout"><div class="payout-top"><img src="'+IMG.jacket+'" alt="Denim jacket, example listing"><div><h3>'+esc(j.n)+'</h3><p>Example sale</p></div></div>'+
        '<div class="row"><span>Your price</span><b>'+fmt(j.p)+'</b></div><div class="row"><span>StudentSwap fee, 8%</span><b class="minus">&minus;'+fmt(fee)+'</b></div>'+
        '<div class="row keep"><span>You keep</span><b>'+fmt(j.p-fee)+'</b></div></div></div></section>';
    }},
    clothes:{title:'Clothes', html:function(){ return '<section class="page"><div class="copy"><span class="eyebrow">Clothes</span><h1>Closet full. Wallet empty. <em>Fix both.</em></h1><p class="lead">Jackets, hoodies, boots and that sweater you swore you would wear. Every price is negotiable, so haggle like a pro.</p><div class="ctas">'+ctaOffer()+'</div></div>'+catVisual('clothes')+'</section>'; }},
    kitchen:{title:'Kitchen', html:function(){ return '<section class="page"><div class="copy"><span class="eyebrow">Kitchenware</span><h1>Cook like a pro. <em>Pay like a student.</em></h1><p class="lead">Pots, rice cookers, kettles and the blender nobody dares to wash. Every price is negotiable. Haggling is part of the recipe.</p><div class="ctas">'+ctaOffer()+'</div></div>'+catVisual('kitchen')+'</section>'; }},
    sport:{title:'Sport', html:function(){ return '<section class="page"><div class="copy"><span class="eyebrow">Sport equipment</span><h1>Get fit. <em>Not broke.</em></h1><p class="lead">Yoga mats, balls, dumbbells and bikes. Zero gym fees. Make an offer now and break a sweat later.</p><div class="ctas">'+ctaOffer()+'</div></div>'+catVisual('sport')+'</section>'; }},
    travel:{title:'Travel', html:function(){ return '<section class="page"><div class="copy"><span class="eyebrow">Travel equipment</span><h1>Pack light. <em>Spend lighter.</em></h1><p class="lead">Suitcases, backpacks and adapters from students who have actually been there. Your next trip just got cheaper.</p><div class="ctas">'+ctaOffer()+'</div></div>'+catVisual('travel')+'</section>'; }},
    guarantee:{title:'Trust guarantee', html:function(){
      return '<section class="page"><div class="copy"><span class="eyebrow">Trust guarantee</span><h1>Real people. <em>Real trust. No drama.</em></h1>'+
        '<p class="lead">Everyone who buys or sells here is verified, so you always know who is on the other side. Trust is the whole deal, for sellers and buyers alike.</p>'+
        '<div class="ctas"><button class="btn btn-primary" data-wish="both" type="button">Join the wishlist</button></div></div>'+
        '<div class="visual"><div class="grid">'+
        infoCard('mail','University email','Only real students get in.')+
        infoCard('phone','Phone number','A real person with a real number.')+
        infoCard('card','ID verification','We check who you really are, so we always know who is on the other side.')+
        '</div></div></section>';
    }},
    community:{title:'Our Community', html:function(){
      return '<section class="page"><div class="copy"><span class="eyebrow">Our Community</span><h1>Built by former exchange students. <em>Powered by you.</em></h1>'+
        '<p class="lead">We have been there: new country, empty suitcase, tight budget. So we built the marketplace we wished we had, and we want to build the community around it too.</p>'+
        '<div class="ctas"><button class="btn btn-primary" data-wish="both" data-mode="community" type="button">Join our Community</button></div></div>'+
        '<div class="visual"><div class="grid">'+
        infoCard('users','Who we are','Former exchange students who know what starting from zero in a new place feels like.')+
        infoCard('cal','Pop-up events','Swap days on campus: bring what you don\'t need, find what you do, meet great people. Coming soon.')+
        infoCard('globe','Everyone is welcome','Exchange students, locals and everyone in between. If you are a student, you belong here.')+
        '</div></div></section>';
    }},
    team:{title:'The team', html:function(){
      var T = [['Loick','Problem & research','#CFE6D6'],['Lucia','Solution & operations','#FBE2DC'],['Marie','Customers & growth','#FBEBD3'],['Chiara','Value proposition','#E4F2E8'],['Mila','Strategy & summary','#F4EEE2']];
      return '<section class="page"><div class="copy"><span class="eyebrow">The team</span><h1>Five students. <em>One clear mission.</em></h1>'+
        '<p class="lead">We got tired of overpaying for stuff and of selling to strangers. So we built the marketplace we wanted.</p>'+
        '<div class="ctas"><a class="btn btn-outline" href="mailto:hello@studentswap.cl">hello@studentswap.cl</a></div></div>'+
        '<div class="visual"><div class="team">'+T.map(function(m){ return '<div class="member"><div class="avatar" style="background:'+m[2]+'">'+m[0][0]+'</div><b>'+m[0]+'</b><span>'+esc(m[1])+'</span></div>'; }).join('')+'</div></div></section>';
    }}
  };

  /* dock */
  $('#dock').innerHTML = DOCK.map(function(d){
    var th = d.img ? '<span class="thumb"><img src="'+IMG[d.img]+'" alt=""></span>'
           : d.id==='sell' ? '<span class="thumb sell">'+I.tag+'</span>'
           : d.initial ? '<span class="thumb" style="font-weight:700;font-family:var(--head)">'+d.initial+'</span>'
           : '<span class="thumb">'+I[d.icon].replace('<svg','<svg style="stroke:var(--green)"')+'</span>';
    return '<a class="dock-item'+(d.small?' only-small':'')+'" href="#'+d.id+'" data-go="'+d.id+'">'+th+'<span>'+d.label+'</span></a>';
  }).join('');

  var current = 'home';
  function show(id){
    if (!PAGES[id]) id = 'home';
    current = id;
    $('#stage').innerHTML = PAGES[id].html();
    $('#stage').scrollTop = 0;
    document.title = 'StudentSwap | ' + PAGES[id].title;
    document.querySelectorAll('.dock-item').forEach(function(a){ a.classList.toggle('active', a.dataset.go === id); });
    document.querySelectorAll('.top-link').forEach(function(a){ a.classList.toggle('active', a.dataset.go === id); });
    try { history.replaceState(null, '', '#' + id); } catch(e){}
  }

  /* modals */
  var openEl = null, trigger = null;
  function openModal(id){
    trigger = document.activeElement;
    openEl = $('#modal-'+id);
    openEl.classList.add('is-open'); openEl.setAttribute('aria-hidden','false');
    var f = openEl.querySelector('input,select,textarea'); if (f) f.focus();
  }
  function closeModal(){
    if (!openEl) return;
    openEl.classList.remove('is-open'); openEl.setAttribute('aria-hidden','true');
    openEl = null; if (trigger && trigger.focus) trigger.focus();
  }
  document.querySelectorAll('[data-close]').forEach(function(el){ el.addEventListener('click', closeModal); });

  var wishMode = '';
  function openWish(role, mode){
    wishMode = mode || '';
    var com = wishMode === 'community';
    $('#wishMsg').textContent = '';
    $('#w-role').value = role || '';
    $('#wishTitle').textContent = com ? 'Join our Community.' : "Tell us what you're looking for.";
    $('#wishIntro').textContent = com ? 'Swap days, pop-up events and a group of students who get it. Leave your details and we will keep you posted.' : "Buying or selling, tell us and we'll check if we can match you.";
    $('#wishDetailsLabel').textContent = com ? 'Anything you would love to see in the community?' : 'What are you looking for, or selling?';
    $('#wishBtn').textContent = com ? 'Join our Community' : 'Join the wishlist';
    var ph = {buyer:'e.g. Looking for a winter coat, size M', seller:'e.g. Selling a yoga mat and a rice cooker', both:'e.g. Looking for a rice cooker under $15.000'};
    $('#w-details').placeholder = com ? 'e.g. A swap day near my campus' : (ph[role] || ph.both);
    openModal('wish');
  }
  $('#wishForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('#w-name').value.trim().split(' ')[0];
    $('#wishMsg').textContent = 'Thanks' + (name ? ', ' + name : '') + (wishMode === 'community' ? "! Welcome to the community. We'll keep you posted." : "! You're on the wishlist. We'll check if we can match you.");
    e.target.reset();
  });

  function offerTarget(key){
    var p = key.split(':');
    if (p[0] === 'p') return [PRODUCTS[p[1]].n, PRODUCTS[p[1]].p];
    var a = CATS[p[1]].also[+p[2]]; return [a[0], a[1]];
  }
  function openOffer(key){
    var t = offerTarget(key);
    $('#offerAsk').textContent = t[0] + ' is listed at ' + clp(t[1]) + '. Every price is negotiable.';
    $('#o-price').value = Math.round(t[1]*0.85/500)*500;
    $('#offerMsg').textContent = '';
    openModal('offer');
  }
  $('#offerForm').addEventListener('submit', function(e){
    e.preventDefault();
    $('#offerMsg').textContent = 'Offer sent. The seller can accept, decline or counter.';
  });

  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]');
    if (g){ e.preventDefault(); show(g.dataset.go); return; }
    var w = e.target.closest('[data-wish]');
    if (w){ openWish(w.dataset.wish, w.dataset.mode); return; }
    var o = e.target.closest('[data-offer]');
    if (o){ openOffer(o.dataset.offer); }
  });

  var ORDER = ['home','sell','clothes','kitchen','sport','travel','community','guarantee','team'];
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeModal(); return; }
    var t = e.target.tagName;
    if (openEl || t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    var i = ORDER.indexOf(current);
    if (e.key === 'ArrowRight' && i < ORDER.length-1) show(ORDER[i+1]);
    if (e.key === 'ArrowLeft' && i > 0) show(ORDER[i-1]);
  });

  var start = (location.hash || '').replace('#','');
  show(PAGES[start] ? start : 'home');
})();
</script>
</body>
</html>
